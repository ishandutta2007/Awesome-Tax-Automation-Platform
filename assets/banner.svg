<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#080c14" />
    </linearGradient>

    <!-- Accent Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <!-- Glowing Pill Gradient -->
    <linearGradient id="pillGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.05" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="strongGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.4; transform: scale(1); }
      50% { opacity: 0.8; transform: scale(1.03); }
    }
    @keyframes floatParticle {
      0% { transform: translateY(0px) translateX(0px); opacity: 0.3; }
      50% { transform: translateY(-25px) translateX(15px); opacity: 0.8; }
      100% { transform: translateY(0px) translateX(0px); opacity: 0.3; }
    }
    @keyframes dashMove {
      to { stroke-dashoffset: -100; }
    }
    .pulse-orb {
      transform-origin: center;
      animation: pulseGlow 6s ease-in-out infinite;
    }
    .floating-dot-1 { animation: floatParticle 5s ease-in-out infinite; }
    .floating-dot-2 { animation: floatParticle 7s ease-in-out infinite 1s; }
    .floating-dot-3 { animation: floatParticle 6s ease-in-out infinite 2s; }
    .dash-line {
      stroke-dasharray: 8, 8;
      animation: dashMove 12s linear infinite;
    }
    .title-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      letter-spacing: -0.02em;
    }
    .subtitle-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 400;
      letter-spacing: 0.05em;
    }
    .badge-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 13px;
      letter-spacing: 0.08em;
    }
  </style>

  <!-- Background Canvas -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGrad)" />

  <!-- Background Grid Pattern -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <line x1="0" y1="60" x2="1200" y2="60" />
    <line x1="0" y1="120" x2="1200" y2="120" />
    <line x1="0" y1="180" x2="1200" y2="180" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="150" y1="0" x2="150" y2="360" />
    <line x1="300" y1="0" x2="300" y2="360" />
    <line x1="450" y1="0" x2="450" y2="360" />
    <line x1="600" y1="0" x2="600" y2="360" />
    <line x1="750" y1="0" x2="750" y2="360" />
    <line x1="900" y1="0" x2="900" y2="360" />
    <line x1="1050" y1="0" x2="1050" y2="360" />
  </g>

  <!-- Glowing Radial Backdrop Lights -->
  <circle class="pulse-orb" cx="200" cy="180" r="140" fill="#38bdf8" fill-opacity="0.08" filter="url(#strongGlow)" />
  <circle class="pulse-orb" cx="1000" cy="180" r="160" fill="#818cf8" fill-opacity="0.08" filter="url(#strongGlow)" />
  <circle class="pulse-orb" cx="600" cy="120" r="180" fill="#c084fc" fill-opacity="0.05" filter="url(#strongGlow)" />

  <!-- Abstract Dynamic Geometric Shapes & Circuits -->
  <g stroke="url(#accentGrad)" stroke-width="1.5" fill="none" opacity="0.4">
    <path class="dash-line" d="M 80,180 Q 250,60 450,180 T 850,180 T 1120,180" />
    <circle cx="250" cy="120" r="4" fill="#38bdf8" />
    <circle cx="650" cy="240" r="4" fill="#818cf8" />
    <circle cx="950" cy="120" r="4" fill="#c084fc" />
  </g>

  <!-- Floating Dynamic Particles -->
  <g fill="#38bdf8" filter="url(#glow)">
    <circle class="floating-dot-1" cx="160" cy="80" r="3" />
    <circle class="floating-dot-2" cx="320" cy="280" r="2.5" />
    <circle class="floating-dot-3" cx="880" cy="90" r="3.5" fill="#818cf8" />
    <circle class="floating-dot-1" cx="1040" cy="270" r="2.5" fill="#c084fc" />
  </g>

  <!-- Top Pill / Badge -->
  <g transform="translate(425, 45)">
    <rect width="350" height="34" rx="17" fill="url(#pillGrad)" stroke="#38bdf8" stroke-opacity="0.3" stroke-width="1" />
    <circle cx="20" cy="17" r="4.5" fill="#34d399" filter="url(#glow)" />
    <text x="36" y="22" fill="#93c5fd" class="badge-text">⚡ CURATED ECOSYSTEM &amp; PLATFORMS</text>
  </g>

  <!-- Main Title -->
  <text x="600" y="160" text-anchor="middle" fill="#ffffff" font-size="44" class="title-text">
    Awesome Tax Automation Platform
  </text>
  
  <text x="600" y="160" text-anchor="middle" fill="url(#accentGrad)" font-size="44" class="title-text" opacity="0.4" filter="url(#glow)">
    Awesome Tax Automation Platform
  </text>

  <!-- Subtitle -->
  <text x="600" y="210" text-anchor="middle" fill="#94a3b8" font-size="17" class="subtitle-text">
    Sales Tax • VAT/GST Engines • Nexus Tracking • Compliance APIs • Open-Source Tools
  </text>

  <!-- Feature Tags / Pills at Bottom -->
  <g transform="translate(230, 260)">
    <!-- Tag 1 -->
    <g transform="translate(0, 0)">
      <rect width="160" height="36" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="80" y="23" text-anchor="middle" fill="#38bdf8" font-family="sans-serif" font-size="13" font-weight="600">📊 SaaS Leaders</text>
    </g>
    <!-- Tag 2 -->
    <g transform="translate(180, 0)">
      <rect width="180" height="36" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="90" y="23" text-anchor="middle" fill="#a78bfa" font-family="sans-serif" font-size="13" font-weight="600">🚀 Open-Source Engines</text>
    </g>
    <!-- Tag 3 -->
    <g transform="translate(380, 0)">
      <rect width="180" height="36" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="90" y="23" text-anchor="middle" fill="#34d399" font-family="sans-serif" font-size="13" font-weight="600">🌐 Global VAT / GST</text>
    </g>
    <!-- Tag 4 -->
    <g transform="translate(580, 0)">
      <rect width="160" height="36" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="80" y="23" text-anchor="middle" fill="#f472b6" font-family="sans-serif" font-size="13" font-weight="600">⚖️ Nexus &amp; Filing</text>
    </g>
  </g>

  <!-- Border Gradient Stroke -->
  <rect x="0.5" y="0.5" width="1199" height="359" rx="15.5" fill="none" stroke="url(#accentGrad)" stroke-opacity="0.25" stroke-width="1" />
</svg>
